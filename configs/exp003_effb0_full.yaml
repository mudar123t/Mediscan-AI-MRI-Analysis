# EXP-003: EfficientNet-B0 (ImageNet), full image.
experiment: EXP-003
run_name: exp003_effb0_full
model:
  name: efficientnet_b0
  kwargs: {pretrained: true}
view: {name: full}
seed: 0
deterministic: true
folds: [0, 1, 2, 3, 4]
train:
  epochs: 60
  batch_size: 32
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 2
  augment: default
  amp: true
  early_stopping_patience: 15
  select_metric: balanced_accuracy
